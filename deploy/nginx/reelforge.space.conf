server {
    client_max_body_size 500M;
    listen 80;
    server_name reelforge.space www.reelforge.space;

    # Long-running ML/video utilities (blur-faces, end-screen, dewatermark,
    # remove-bg, scenes, beats, chapters, export-variant) can take up to
    # ~10-15 minutes on CPU. Default nginx 60s timeout would surface as a
    # 504 Gateway Timeout in the browser even though the backend is still
    # working. 30-minute window is generous but bounded.
    proxy_connect_timeout 60s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    send_timeout 1800s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Disable response buffering so streamed downloads (mp4) don't get
        # buffered to disk first and so progress messages flush immediately.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
